name: Continuous Integration + Announcement

env:
  GH_PKG_URL: "https://maven.pkg.github.com/${{ github.repository }}"

on:
  push:
    tags-ignore:
      - v*
    paths:
      - "gradle/*.versions.toml"
      - "core-api/**"
      - "neoforge-datagen/**"
      - "neoforge-main/**"
  workflow_dispatch:

jobs:
  vars:
    name: Get Variables
    runs-on: ubuntu-22.04
    outputs:
      version: ${{steps.version.outputs.version}}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 150
          fetch-tags: "true"

      - name: Fetch Tags
        run: git fetch --tags

      - name: Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          change_path: "neoforge-main"
          version_format: "${major}.${minor}.${patch}"
          search_commit_body: true
          bump_each_commit: true

  datagen:
    needs: [vars]
    uses: ./.github/workflows/_datagen.yml
    secrets: inherit
    with:
      version: ${{ needs.vars.outputs.version }}

  tests:
    needs: [vars, datagen]
    uses: ./.github/workflows/_run-gametests.yml
    secrets: inherit
    with:
      version: ${{ needs.vars.outputs.version }}

  publish:
    needs: [vars, tests]
    uses: ./.github/workflows/_publish.yml
    secrets: inherit
    with:
      version: ${{ needs.vars.outputs.version }}

  create-tag:
    name: Create tag
    needs: [vars, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/releases/v${{ needs.vars.outputs.version }}',
              sha: context.sha
            })

  get-package-info:
    name: Get Package Info
    needs: [ publish ]
    uses: ./.github/workflows/_download-latest-package-info.yml
    secrets: inherit

  announce:
    name: Discord Announcement
    needs: [ get-package-info ]
    uses: ./.github/workflows/_announce-latest-build.yml
    secrets: inherit

  release-cf:
    name: Release Alpha on CurseForge
    needs: [ get-package-info ]
    uses: ./.github/workflows/_release-cf-alpha.yml
    secrets: inherit
