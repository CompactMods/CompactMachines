# REQUIRES DATAGEN TO BE CALLED IN A JOB BEFORE THIS!!

name: Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    name: Publish Code as Github Package - ${{ inputs.version }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pull Built Generated Data
        uses: actions/download-artifact@v5
        with:
          name: generated-data
          path: neoforge-main/src/generated/resources

      - name: Pull Compilation Data (Core)
        uses: actions/download-artifact@v5
        with:
          name: build-core
          path: core-api/build

      - name: Pull Compilation Data (Main)
        uses: actions/download-artifact@v5
        with:
          name: build-main
          path: neoforge-main/build

      - name: Build It Again, To Be Sure
        run: ./gradlew :neoforge-main:build
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: ./gradlew :neoforge-main:publish
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}