name: Manual Build

env:
  GH_PKG_URL: "https://maven.pkg.github.com/${{ github.repository }}"

permissions:
  contents: write # For creating and pushing the tag

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: 'v7.0.0'
      run_tests:
        required: true
        type: boolean
        default: 'true'
      add_version_tag:
        required: true
        type: boolean
        default: 'false'
      release_packages:
        required: true
        type: boolean
        default: 'false'
      announce:
        required: true
        type: boolean
        default: 'false'
      release_cf:
        required: true
        type: boolean
        default: 'false'

jobs:
  datagen:
    uses: ./.github/workflows/_datagen.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  tests:
    needs: [datagen]
    if: ${{ inputs.run_tests == 'true' }}
    uses: ./.github/workflows/_run-gametests.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  publish:
    if: ${{ inputs.release_packages == 'true' }}
    needs: [ tests]
    uses: ./.github/workflows/_publish.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  create-tag:
    name: Create tag
    needs: [publish]
    if: ${{ inputs.add_version_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/releases/v${{ inputs.version }}',
              sha: context.sha
            })

  announce:
    name: Discord Announcement
    if: ${{ inputs.announce == 'true' }}
    needs: [ publish ]
    uses: ./.github/workflows/_announce-latest-build.yml
    secrets: inherit

  release-cf:
    name: Release Alpha on CurseForge
    if: ${{ inputs.release_cf == 'true' }}
    needs: [ publish ]
    uses: ./.github/workflows/_release-cf-alpha.yml
    secrets: inherit
