license = "MIT"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# Registered here, not via the MixinConfigs MANIFEST.MF entry — modern NeoForge
# (FML 11+) discovers mixin configs from this toml. The config file itself
# lives at the root of api-*.jar, which is on the runtime classpath as a
# GAMELIBRARY, so Mixin resolves the resource by name across the classpath.
# Required: MinecraftServerMixin implements the interface-injected
# IForwardingAttachmentHolder / IServerCapabilityHolder methods.
[[mixins]]
config = "compactmachines.mixins.json"

[[mods]] #mandatory
modId = "compactmachines"
version = "${mod_version}"
displayName = "Compact Machines"
authors = "Davenonymous, RobotGryphon" #optional
description = "It's all so tiny!"
featureFlags="META-INF/feature_flags.json"

issueTrackerURL = "https://github.com/CompactMods/CompactMachines/issues"

#updateJSONURL="http://myurl.me/" #optional
displayURL = "https://compactmods.dev"

# A file name (in the root of the mod JAR) containing a logo for display
# logoFile="examplemod.png" #optional

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.compactmachines]] #optional
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.compactmachines]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Client-only: the machine screen is built with screenlib's UI
[[dependencies.compactmachines]]
modId = "screenlib"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "CLIENT"
